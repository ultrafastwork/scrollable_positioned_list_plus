name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, to catch breakage from new Flutter releases before users do.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full checks on the current stable release.
  check:
    name: Analyze, test and validate (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub get --directory example
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Test example
        run: flutter test
        working-directory: example
      - name: Validate package
        run: flutter pub publish --dry-run

  # Tests on the oldest supported release (pubspec `flutter: ">=3.44.0"`)
  # and on beta, as an early warning of upcoming breakage.
  compat:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum 3.44.0
            channel: stable
            version: 3.44.0
          - name: beta
            channel: beta
            version: ""
    # A beta failure is a warning, not a blocker for pushes and pull requests;
    # it only fails the weekly scheduled run, so it still gets noticed.
    continue-on-error: ${{ matrix.channel == 'beta' && github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Test
        run: flutter test
